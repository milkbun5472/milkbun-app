name: CoveWatch
options:
  bundleIdPrefix: com.lisa
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  CoveWatch:
    type: application
    platform: watchOS
    sources:
      - CoveWatch
    info:
      path: CoveWatch/Info.plist
      properties:
        CFBundleDisplayName: Cove
        NSMicrophoneUsageDescription: 用于按住说话并把语音发送给言秋。
        WKWatchOnly: true
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisa.covewatch
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true


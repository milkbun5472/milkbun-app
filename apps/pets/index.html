<body class="pet-game">
<main id="view" aria-label="绒绒小镇三维场景"></main>
<header class="scene-head">
<div class="pet-town-line"><button id="selected-pet" class="selected-pet" aria-label="家里的宠物" hidden></button><button id="light" aria-pressed="false" aria-label="切换到傍晚">傍晚</button></div>
<div class="pet-scene-links"><button id="back" aria-label="回到宠物身边">跟着它</button><nav class="tools" aria-label="小镇生活"><button id="pet-talk" hidden>和TA说话</button><button id="pet-work" hidden>职业</button><button id="pet-status" hidden>看看它</button><button id="pet-photo" hidden>拍照</button></nav></div>
<div class="heading"><h1>绒绒小镇</h1><p id="subtitle">点地面散步 · 拖动画面</p></div></header>
<div id="door-labels" aria-label="街上的门牌"></div><div id="loading" role="status">正在打开小街区…</div>
<div class="pet-scene-dock"><div class="near-door"><button id="enter" hidden>走进屋里</button></div><div class="pet-view-tools" role="group" aria-label="场景视角"><button id="watch-view" class="pet-watch" aria-label="镜头看谁" hidden>跟着它</button><section id="scene-camera" class="scene-camera" aria-label="镜头控制" hidden></section><button id="reset" aria-label="回到场景全景">全景</button></div>
<nav id="home-souvenirs" class="home-souvenirs" aria-label="它带回家的小东西" hidden><button data-souvenir="bread" aria-label="分给它一个小面包" hidden>面包篮</button><button data-souvenir="ball" aria-label="陪它玩自己的小球" hidden>自己的小球</button><button data-souvenir="box" aria-label="让它在自己的小纸箱里休息" hidden>小纸箱</button><button data-souvenir="flowers" aria-label="把带回的小花插进花瓶" hidden>小花瓶</button><button data-souvenir="memory" aria-label="看看第一次试工纪念" hidden>第一份工作</button></nav>
<nav id="home-actions" class="home-actions" aria-label="在家陪伴宠物" hidden><button data-care="feed">添粮</button><button data-care="snack">零食</button><button data-care="play" data-toy="ball">玩球</button><button data-care="play" data-toy="mouse">玩老鼠</button><button data-care="rest">休息</button><button data-care="pet">摸摸</button></nav>
<nav id="walk-actions" class="home-actions walk-actions" aria-label="两人同行遛宠物" hidden><button data-walk="pause">歇歇</button><button data-walk="play">追球</button><button data-walk="pet">摸摸</button><button data-walk="resume">继续走</button><button data-walk="home">一起回家</button></nav>
<footer class="scene-foot" aria-live="polite"><strong id="zone-title">绒绒小镇</strong><span id="zone-text">点地面散步 · 点房子门牌走进去</span></footer></div>

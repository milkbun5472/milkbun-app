<body class="pet-game">
<main id="view" aria-label="绒绒小镇三维场景"></main>
<header class="scene-head"><button id="back" aria-label="回到猫猫身边">跟着猫</button><div class="heading"><h1>绒绒小镇</h1><p id="subtitle">点地面散步 · 拖动画面</p></div><div class="tools"><button id="pet-talk" hidden>和TA说话</button><button id="pet-work" hidden>职业</button><button id="pet-status" hidden>看看它</button><button id="light" aria-pressed="false" aria-label="切换到傍晚">傍晚</button><button id="reset" aria-label="回到场景全景">全景</button></div></header>

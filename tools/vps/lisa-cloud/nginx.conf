server {
  listen 8080;
  client_max_body_size 52m;

  location = /healthz {
    add_header Content-Type application/json;
    return 200 '{"ok":true,"service":"lisa-cloud"}';
  }

  location /auth/v1/ {
    # GoTrue 的普通响应自带 CORS，但它对 WKWebView 发出的 PUT /user 预检只回 204、
    # 不带 allow-* 头，导致账号已换证成功却卡死在「写入新密码」这一步。
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Cache-Control "no-store" always;
      return 204;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /auth/v1;
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
    proxy_pass http://rest:3000/;
  }

  location /storage/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
    proxy_pass http://storage:5000/;
  }

  location = /migrate/v1/session {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://session-migrator:8081/session;
  }

  location = /functions/v1/llm-proxy {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
    proxy_pass http://functions:8082/llm-proxy;
  }
}

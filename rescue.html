<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ARCHIVE 安全刷新</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f7f3ed;color:#2e2925;margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(84vw,420px);text-align:center}h1{font-size:22px}p{line-height:1.7;color:#756b63}button{border:0;border-radius:999px;padding:14px 24px;background:#24211f;color:#fff;font-size:16px}
  </style>
</head>
<body><main><h1>正在安全刷新 ARCHIVE</h1><p id="status">只清理旧版程序缓存，不会删除聊天、图片、登录或本机资料。</p><button id="retry" hidden>再试一次</button></main>
<script>
(async function rescue(){
  const status=document.getElementById("status"), retry=document.getElementById("retry");
  try {
    if ("serviceWorker" in navigator) {
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r=>r.unregister()));
    }
    if ("caches" in window) {
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith("archive-shell-")).map(k=>caches.delete(k)));
    }
    status.textContent="旧版缓存已清理，正在打开 v52.00……";
    setTimeout(()=>location.replace("./?fresh=5200-"+Date.now()),700);
  } catch (error) {
    status.textContent="刷新没有完成，请点下面再试。";
    retry.hidden=false; retry.onclick=()=>location.reload();
  }
})();
</script></body></html>

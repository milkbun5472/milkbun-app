<body>
<header><h1>双人卧铺</h1><span>列车窗景 · 湖畔与海湾</span></header>
<main><div id="stage"><div class="badge" id="journey-label">林间山谷 · 晴天</div><div id="status" role="status">正在载入车厢…</div></div>
<aside><h2>一节可以慢慢待着的车厢</h2><p>红屋、湖面和倒影慢慢展开；彩色小镇沿着山坡延伸到港口。观景路段会自动放慢，留一点时间看风景。</p>
<div class="views"><button data-view="overview" aria-pressed="true">看全景</button><button data-view="table" aria-pressed="false">拼图桌</button><button data-view="berths" aria-pressed="false">看卧铺</button><button data-view="top" aria-pressed="false">看布局</button><button data-view="window" aria-pressed="false">看窗外</button></div>
<div class="environment">
<label for="route">沿途风景<select id="route"><option value="forest">林间山谷</option><option value="coast">海岸灯塔</option><option value="country">田野村落</option></select></label>
<label for="weather">窗外天气<select id="weather"><option value="clear">晴天</option><option value="cloudy">阴天</option><option value="rain">下雨</option><option value="snow">飘雪</option><option value="fog">薄雾</option></select></label>
</div>
<label class="season-control" for="season">沿途季节<select id="season"><option value="spring">春天 · 新绿花开</option><option value="summer">夏天 · 浓绿原野</option><option value="autumn">秋天 · 金叶暖林</option><option value="winter">冬天 · 枝头积雪</option></select></label>
<div class="time-control"><label for="hour">时间 <output id="clock">09:00</output></label><input id="hour" type="range" min="0" max="23.99" step="0.01" value="9"><div class="time-marks"><span>深夜</span><span>清晨</span><span>正午</span><span>日暮</span><span>深夜</span></div></div>
<div class="destination-shortcuts"><button data-destination="lake">山中湖泊</button><button data-destination="town">海边小镇</button></div>
<div class="passing-row"><span id="passing" aria-live="polite">林间前行</span><button id="next-stop">下一段</button></div><div class="time-control speed-control"><label for="speed">车速 <output id="speed-label">1.0 倍</output></label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></div>
<div class="journey-actions"><button id="play" aria-pressed="true">暂停窗景</button><label class="row"><input id="auto-time" type="checkbox">昼夜流转</label></div>
<label class="row shell-control"><input id="shell" type="checkbox">合上车厢外壳</label>
<div class="zoom"><label for="zoom">远近</label><input id="zoom" type="range" min="0.7" max="1.6" step="0.01" value="1"></div>
<hr><h2>模型文件</h2><div class="downloads"><a class="download" href="./carriage.blend" download>Blender 源文件</a><a class="download" href="./carriage.glb?v=fg-2b387d084fe00867" download>下载 GLB</a></div><p>这是模型预览。拍照、拼图和聊天玩法尚未接入。</p>
</aside></main><footer><span>拖动旋转 · 双指或滚轮缩放</span><span>远山慢行 · 近景掠过</span></footer>
